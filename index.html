<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI pirates Studio</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; font: 17px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #f6f7f5; color: #1d2320; }
  main { max-width: 640px; margin: 0 auto; padding: 64px 20px; }
  h1 { font-size: 32px; margin: 0 0 8px; }
  p { margin: 0 0 16px; color: #4a524e; }
  .game { margin-top: 40px; padding: 20px; border-radius: 14px; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .game h2 { margin: 0 0 6px; font-size: 22px; }
  a { color: #1c7a43; }
  footer { margin-top: 48px; font-size: 14px; color: #7a827e; }
  @media (prefers-color-scheme: dark) {
    body { background: #141816; color: #e8ece9; }
    p, footer { color: #a3aca7; }
    .game { background: #1d2320; box-shadow: none; }
    a { color: #6fd39a; }
  }
</style>
</head>
<body>
<main>
  <h1>AI pirates Studio</h1>
  <p>Independent mobile game studio.</p>
  <section class="game">
    <h2>Snapshot Solitaire</h2>
    <p>A relaxing picture-assembly solitaire: put the fragments together and watch the pictures come alive.</p>
    <p><a href="https://play.google.com/store/apps/details?id=com.aipirates.snapshotsolitaire">Get it on Google Play</a>
      · <a href="https://vladmotilev-tech.github.io/snapshot-solitaire-site/privacy.html">Privacy Policy</a></p>
  </section>
  <footer>© 2026 AI pirates Studio</footer>
</main>
</body>
</html>
